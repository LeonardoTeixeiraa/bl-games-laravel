name: infraestrutura-blgames
services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_PASSWORD: ${DB_PASSWORD_MYSQL}
      MYSQL_DATABASE: ${DB_NAME_MYSQL}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD_MYSQL}
      MYSQL_USER: ${DB_USER_MYSQL}
    volumes:
      - blgames-mysql-data:/var/lib/mysql
    ports:
      - "3307:3306"
volumes:
  blgames-mysql-data:
